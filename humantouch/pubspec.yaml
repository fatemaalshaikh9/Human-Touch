name: humantouch
description: "Human Touch Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI & Fonts
  google_fonts: ^6.3.0
  percent_indicator: ^4.2.3
  font_awesome_flutter: ^10.7.0

  # State management
  provider: ^6.1.5

  # Local storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  # Date / localization
  intl: ^0.20.2

  # 🔊 Communication (AI voice + speech)
  flutter_tts: ^4.2.3
  speech_to_text: ^7.3.0

  # 🔔 Notifications
  flutter_local_notifications: ^17.2.3

  # 📍 Location & Maps
  geolocator: ^14.0.2
  google_maps_flutter: ^2.7.0
  http: ^1.2.2   # API (AI + Places)

  # 📞 Call + External links
  url_launcher: ^6.3.2

  # 🚨 Emergency
  flutter_sms: ^2.3.3

  # 🔗 QR (patient + companion)
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.2

  # 🔥 Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1

  # 📂 File & Image (chat + call)
  image_picker: ^1.1.2

  # ⭐ Rating (reviews)
  flutter_rating_bar: ^4.0.1

  # 📅 Calendar (booking schedule)
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/assist_images/

  
